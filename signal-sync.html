<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Sync</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<style>
    body { margin: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #0f172a; font-family: 'Space Grotesk', sans-serif; overflow: hidden; position: relative; cursor: crosshair; touch-action: none; }
    
    .ui { position: absolute; z-index: 10; text-align: center; pointer-events: none; background: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 20px; border: 1px solid #cbd5e1; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); width: 90%; max-width: 480px; }
    h1 { font-size: 2.8rem; margin-bottom: 8px; color: #0f172a; }
    
    .diff-group { display: flex; justify-content: center; gap: 8px; margin: 20px 0; pointer-events: auto; }
    .diff-btn { padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .diff-btn.active { transform: scale(1.08); box-shadow: 0 4px 10px rgba(0,0,0,0.12); outline: 2px solid #0f172a; }
    
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .btn { padding: 12px 30px; background: #4f46e5; border: none; color: white; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: inherit; pointer-events: auto; margin: 8px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    .btn:hover { background: #4338ca; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #334155; box-shadow: none; }

    #target { 
        position: absolute; 
        border-radius: 50%; 
        background: radial-gradient(circle, #38bdf8 0%, #2563eb 100%); 
        box-shadow: 0 0 35px rgba(37, 99, 235, 0.55); 
        display: none; 
        cursor: pointer; 
        z-index: 5; 
        pointer-events: auto; 
        transform: translate(-50%, -50%); 
        animation: pulse 0.9s infinite; 
        border: 3px solid #1d4ed8; 
    }
    
    @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.12); } 100% { transform: translate(-50%, -50%) scale(1); } }

    /* POPUP MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.94); display: flex; justify-content: center; align-items: center; z-index: 50; backdrop-filter: blur(8px); }
    .modal-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 20px; padding: 35px; width: 90%; max-width: 460px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
    .score-banner { font-size: 3.2rem; font-weight: 800; color: #16a34a; margin: 15px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; font-size: 0.85rem; }
</style>
</head>
<body>
    <div id="target"></div>

    <div class="ui" id="uiPanel">
        <h1>SIGNAL SYNC</h1>
        <p style="color:#64748b;">Select difficulty, then hover or glide across the node immediately upon deployment.</p>

        <div class="diff-group">
            <button class="diff-btn btn-easy active" onclick="setDifficulty('Easy')">Easy</button>
            <button class="diff-btn btn-med" onclick="setDifficulty('Medium')">Medium</button>
            <button class="diff-btn btn-hard" onclick="setDifficulty('Hard')">Hard</button>
            <button class="diff-btn btn-cyanx" onclick="setDifficulty('CYANX AI')">CYANX AI</button>
        </div>

        <button class="btn" onclick="startWait()">INITIALIZE</button>
        <button class="btn btn-outline" onclick="window.location.href='game.html'">BACK</button>
    </div>

    <!-- SCORE POPUP MODAL -->
    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 id="resultTitle" style="font-size:1.8rem; color:#0f172a; margin-bottom: 5px;">SYNC COMPLETED</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:#64748b; font-size:0.95rem;">REACTION LATENCY</div>
            <div class="score-banner" id="popupReaction">0 ms</div>
            <div id="rankTag" style="font-weight:700; font-size:1.1rem; margin-bottom:10px;"></div>
            <p id="highScoreNote" style="font-size:0.9rem; color:#15803d; font-weight:600; margin-bottom:20px;"></p>
            
            <div>
                <button class="btn" onclick="retrySync()">RETRY</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    const target = document.getElementById('target');
    const uiPanel = document.getElementById('uiPanel');

    let currentDifficulty = 'Easy';
    const diffConfigs = {
        'Easy':     { size: 90, minDelay: 1500, maxDelay: 3200, distPad: 140 },
        'Medium':   { size: 75, minDelay: 1100, maxDelay: 2500, distPad: 180 },
        'Hard':     { size: 58, minDelay: 800,  maxDelay: 2000, distPad: 220 },
        'CYANX AI': { size: 44, minDelay: 500,  maxDelay: 1500, distPad: 260 }
    };

    let startTime;
    let timeoutId;
    let isWaiting = false;
    let targetActive = false;

    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 2;

    window.addEventListener('mousemove', (e) => { pointerX = e.clientX; pointerY = e.clientY; });
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            pointerX = e.touches[0].clientX; pointerY = e.touches[0].clientY;
            checkTouchSlide(e.touches[0]);
        }
    }, { passive: true });

    function setDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
    }

    function startWait() {
        uiPanel.style.display = 'none';
        target.style.display = 'none';
        targetActive = false;
        isWaiting = true;
        
        const cfg = diffConfigs[currentDifficulty];
        let randomDelay = Math.random() * (cfg.maxDelay - cfg.minDelay) + cfg.minDelay;
        timeoutId = setTimeout(showTarget, randomDelay);
    }

    function showTarget() {
        isWaiting = false;
        const cfg = diffConfigs[currentDifficulty];
        target.style.width = cfg.size + 'px';
        target.style.height = cfg.size + 'px';

        let padding = 100;
        let x, y, dist;
        let attempts = 0;

        do {
            x = Math.random() * (window.innerWidth - padding * 2) + padding;
            y = Math.random() * (window.innerHeight - padding * 2) + padding;
            dist = Math.hypot(x - pointerX, y - pointerY);
            attempts++;
        } while (dist < cfg.distPad && attempts < 25);
        
        target.style.left = x + 'px';
        target.style.top = y + 'px';
        target.style.display = 'block';
        targetActive = true;
        startTime = performance.now();
    }

    function handleTrigger() {
        if (!targetActive) return;
        targetActive = false;

        let reactionTime = Math.floor(performance.now() - startTime);
        target.style.display = 'none';

        const prevBest = parseInt(localStorage.getItem('cyanx_signal_best') || 9999);
        let isNewHigh = false;
        if (reactionTime < prevBest) {
            localStorage.setItem('cyanx_signal_best', reactionTime);
            localStorage.setItem('cyanx_signal_mode', currentDifficulty);
            isNewHigh = true;
        }

        let rank = "HUMAN";
        let rankColor = "#64748b";
        if (reactionTime < 160) { rank = "CYANX OPERATOR 👑"; rankColor = "#d97706"; }
        else if (reactionTime < 240) { rank = "NEURAL CANDIDATE"; rankColor = "#4f46e5"; }
        else if (reactionTime < 340) { rank = "FAST HUMAN"; rankColor = "#0284c7"; }

        const modal = document.getElementById('scoreModal');
        const badge = document.getElementById('resultBadge');
        const scoreVal = document.getElementById('popupReaction');
        const rankTag = document.getElementById('rankTag');
        const highNote = document.getElementById('highScoreNote');

        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;

        scoreVal.innerText = reactionTime + " ms";
        rankTag.innerText = rank;
        rankTag.style.color = rankColor;
        highNote.innerText = isNewHigh ? "🎉 NEW REFLEX RECORD RECORDED!" : `Fastest: ${prevBest} ms`;

        modal.style.display = 'flex';
    }

    target.addEventListener('pointerenter', handleTrigger);
    target.addEventListener('mouseenter', handleTrigger);
    target.addEventListener('mouseover', handleTrigger);

    function checkTouchSlide(touch) {
        if (!targetActive) return;
        const rect = target.getBoundingClientRect();
        const touchDist = Math.hypot(touch.clientX - (rect.left + rect.width / 2), touch.clientY - (rect.top + rect.height / 2));
        if (touchDist <= (rect.width / 2) + 10) handleTrigger();
    }

    target.addEventListener('touchstart', (e) => { e.preventDefault(); handleTrigger(); });

    document.body.addEventListener('mousedown', (e) => {
        if (isWaiting && uiPanel.style.display === 'none') {
            clearTimeout(timeoutId);
            isWaiting = false;
            alert("PREMATURE SYNC DETECTED! Don't click or glide early.");
            retrySync();
        }
    });

    function retrySync() {
        document.getElementById('scoreModal').style.display = 'none';
        uiPanel.style.display = 'block';
    }
</script>
</body>
</html>
