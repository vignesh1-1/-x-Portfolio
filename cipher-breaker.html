<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cipher Breaker 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root {
        --bg-pure: #ffffff;
        --text-main: #000000;
        --text-sub: #64748b;
        --border-color: #cbd5e1;
    }
    body.dark-mode {
        --bg-pure: #000000;
        --text-main: #ffffff;
        --text-sub: #94a3b8;
        --border-color: #262626;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg-pure); color: var(--text-main); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; padding-bottom: 24px; }
    canvas#bgVaultCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    .header-bar { z-index: 10; text-align: center; margin-top: 58px; margin-bottom: 6px; padding: 0 12px; }
    h1 { color: var(--text-main); margin: 0 0 4px 0; font-size: clamp(1.6rem, 5vw, 2.3rem); letter-spacing: 1px; }
    p.sub { color: var(--text-sub); margin: 0 0 10px 0; letter-spacing: 1.5px; text-transform: uppercase; font-size: clamp(0.68rem, 2.2vw, 0.8rem); }
    
    .diff-group { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; z-index: 10; flex-wrap: wrap; }
    .diff-btn { padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .diff-btn.active { transform: scale(1.06); box-shadow: 0 4px 10px rgba(79,70,229,0.25); outline: 2px solid var(--text-main); }
    
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .workspace { z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 92%; max-width: 980px; align-items: center; }
    .vault-spacer { height: 340px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; pointer-events: none; }
    .vault-caption { background: var(--bg-pure); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-size: 0.74rem; color: #4f46e5; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

    .terminal { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px; box-shadow: 0 15px 40px rgba(79, 70, 229, 0.12); }
    
    .log { height: 135px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; padding-right: 4px; }
    .log-entry { padding: 8px 12px; background: var(--bg-pure); border-radius: 8px; border: 1px solid var(--border-color); border-left: 4px solid #4f46e5; display: flex; justify-content: space-between; align-items: center; }
    .log-entry.exact { border-left-color: #16a34a; }
    
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] { flex-grow: 1; width: 100%; padding: 10px; background: var(--bg-pure); border: 1px solid var(--border-color); color: var(--text-main); font-size: 1.35rem; border-radius: 10px; text-align: center; font-family: monospace; outline: none; font-weight: bold; letter-spacing: 6px; }
    input[type="text"]:focus { border-color: #4f46e5; }
    
    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
    .key-btn { padding: 11px 0; background: var(--bg-pure); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: monospace; }
    .key-btn:active { border-color: #4f46e5; color: #4f46e5; transform: scale(0.95); }

    .btn { padding: 10px 20px; background: #4f46e5; border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    .btn-outline { background: var(--bg-pure); border: 1px solid var(--border-color); color: var(--text-main); box-shadow: none; }
    
    .status { font-size: 0.85rem; color: #16a34a; text-align: center; min-height: 18px; font-weight: bold; }
    .btn-return { position: fixed; top: 14px; left: 14px; padding: 8px 16px; background: var(--bg-pure); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 30px; text-decoration: none; font-size: 0.82rem; font-weight: 600; z-index: 20; }

    @media (max-width: 820px) {
        .workspace { grid-template-columns: 1fr; gap: 10px; }
        .vault-spacer { height: 155px; }
        .log { height: 110px; }
    }

    /* POPUP MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pure); display: flex; justify-content: center; align-items: center; z-index: 50; padding: 16px; }
    .modal-card { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 22px; padding: 30px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15); }
    .score-banner { font-size: 2.8rem; font-weight: 800; color: #4f46e5; margin: 12px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; font-size: 0.8rem; }
</style>
</head>
<body>
    <canvas id="bgVaultCanvas"></canvas>
    <a href="game.html" class="btn-return"><i class="fa-solid fa-arrow-left"></i> BACK</a>
    
    <div class="header-bar">
        <h1>CIPHER BREAKER 3D</h1>
        <p class="sub" id="modeDescription">Crack the encrypted 3D Cryptex Vault</p>
        <div class="diff-group">
            <button class="diff-btn btn-easy active" onclick="changeDifficulty('Easy')">Easy</button>
            <button class="diff-btn btn-med" onclick="changeDifficulty('Medium')">Medium</button>
            <button class="diff-btn btn-hard" onclick="changeDifficulty('Hard')">Hard</button>
            <button class="diff-btn btn-cyanx" onclick="changeDifficulty('CYANX AI')">CYANX AI</button>
        </div>
    </div>

    <div class="workspace">
        <div class="vault-spacer">
            <div class="vault-caption"><i class="fa-solid fa-microchip"></i> 3D Cryptex Tumbler Core</div>
        </div>

        <div class="terminal">
            <div class="log" id="logArea"></div>
            
            <form class="input-row" id="guessForm">
                <input type="text" inputmode="none" id="guessInput" placeholder="000" maxlength="3" autocomplete="off" required>
                <button type="submit" class="btn" id="submitBtn">DECRYPT</button>
            </form>

            <div class="keypad" id="keypadContainer"></div>
            <div class="status" id="statusMsg"></div>
        </div>
    </div>

    <!-- SCORE POPUP MODAL -->
    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 id="resultTitle" style="font-size:1.6rem; color:#16a34a; margin-bottom: 5px;">VAULT DECRYPTED</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:var(--text-sub); font-size:0.9rem;">ATTEMPTS UTILIZED</div>
            <div class="score-banner" id="popupAttempts">0</div>
            <p id="highScoreNote" style="font-size:0.88rem; color:#15803d; font-weight:600; margin-bottom:18px;"></p>
            
            <div>
                <button class="btn" onclick="retryCipher()">PLAY AGAIN</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    // --- PURE BLACK / WHITE THEME SYNC ---
    let isDarkTheme = false;
    function checkTheme() {
        const saved = localStorage.getItem('theme') || localStorage.getItem('cyanx_theme') || 'light';
        isDarkTheme = (saved === 'dark');
        document.body.classList.toggle('dark-mode', isDarkTheme);
        if (vaultScene) {
            vaultScene.background = new THREE.Color(isDarkTheme ? 0x000000 : 0xffffff);
        }
    }
    window.addEventListener('storage', checkTheme);

    // --- THREE.JS FULL-SCREEN 3D CRYPTEX VAULT ---
    const canvas = document.getElementById('bgVaultCanvas');
    const vaultScene = new THREE.Scene();
    checkTheme();

    const vaultCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    vaultCamera.position.set(0, 1.5, 13);

    const vaultRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    vaultRenderer.setSize(window.innerWidth, window.innerHeight);
    vaultRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    vaultScene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const keyLight = new THREE.PointLight(0x6366f1, 3, 40);
    keyLight.position.set(-5, 6, 10);
    vaultScene.add(keyLight);

    const rimLight = new THREE.PointLight(0x38bdf8, 2.5, 40);
    rimLight.position.set(5, -5, 8);
    vaultScene.add(rimLight);

    const cryptexGroup = new THREE.Group();
    vaultScene.add(cryptexGroup);

    function updateVaultLayout() {
        if (window.innerWidth > 820) {
            cryptexGroup.position.set(-3.2, -0.3, 0);
            cryptexGroup.scale.set(1, 1, 1);
        } else {
            cryptexGroup.position.set(0, 2.45, -1.5);
            cryptexGroup.scale.set(0.68, 0.68, 0.68);
        }
    }
    updateVaultLayout();

    let tumblerRings = [];
    const coreCrystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(1.05, 1),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.7, roughness: 0.15, metalness: 0.9 })
    );
    const outerCage = new THREE.Mesh(
        new THREE.IcosahedronGeometry(2.85, 1),
        new THREE.MeshBasicMaterial({ color: 0x4f46e5, wireframe: true, transparent: true, opacity: 0.22 })
    );
    cryptexGroup.add(coreCrystal, outerCage);

    function buildCryptexTumblers(count) {
        tumblerRings.forEach(r => cryptexGroup.remove(r.mesh));
        tumblerRings = [];
        for (let i = 0; i < count; i++) {
            const radius = 1.45 + i * 0.34;
            const ringGroup = new THREE.Group();
            const torus = new THREE.Mesh(
                new THREE.TorusGeometry(radius, 0.11, 16, 10),
                new THREE.MeshStandardMaterial({ color: 0x4f46e5, emissive: 0x1e1b4b, roughness: 0.2, metalness: 0.85 })
            );
            const marker = new THREE.Mesh(
                new THREE.BoxGeometry(0.24, 0.24, 0.24),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.9 })
            );
            marker.position.set(radius, 0, 0);
            ringGroup.add(torus, marker);
            ringGroup.rotation.x = (i % 2 === 0 ? 0.35 : -0.35);
            cryptexGroup.add(ringGroup);
            tumblerRings.push({ mesh: ringGroup, torus, targetRotZ: 0 });
        }
    }

    let spinEnergy = 1;
    function animateVault() {
        requestAnimationFrame(animateVault);
        spinEnergy = Math.max(1, spinEnergy * 0.94);

        coreCrystal.rotation.y += 0.025 * spinEnergy;
        coreCrystal.rotation.x += 0.015 * spinEnergy;
        outerCage.rotation.y -= 0.008 * spinEnergy;

        tumblerRings.forEach((r, idx) => {
            r.mesh.rotation.z += (r.targetRotZ - r.mesh.rotation.z) * 0.12;
            r.mesh.rotation.y += (idx % 2 === 0 ? 0.008 : -0.008) * spinEnergy;
        });

        vaultRenderer.render(vaultScene, vaultCamera);
    }
    requestAnimationFrame(animateVault);

    function setVaultStatus(hexColor, boost = 5) {
        coreCrystal.material.color.setHex(hexColor);
        coreCrystal.material.emissive.setHex(hexColor);
        spinEnergy = boost;
    }

    // --- CIPHER BREAKER GAME LOGIC ---
    const logArea = document.getElementById('logArea');
    const guessForm = document.getElementById('guessForm');
    const guessInput = document.getElementById('guessInput');
    const statusMsg = document.getElementById('statusMsg');
    const modeDesc = document.getElementById('modeDescription');
    const keypadContainer = document.getElementById('keypadContainer');

    let currentDifficulty = 'Easy';
    const configs = {
        'Easy':     { digits: 3, maxAttempts: 10, pool: 6, desc: "Crack 3-digit Code (Numbers 0-5) [10 Attempts]" },
        'Medium':   { digits: 4, maxAttempts: 8, pool: 10, desc: "Crack 4-digit Code (Numbers 0-9) [8 Attempts]" },
        'Hard':     { digits: 4, maxAttempts: 6, pool: 10, desc: "Crack 4-digit Code (Numbers 0-9) [6 Attempts]" },
        'CYANX AI': { digits: 5, maxAttempts: 6, pool: 10, desc: "Crack 5-digit Code (Numbers 0-9) [6 Attempts]" }
    };

    let secretCode = "";
    let attempts = 0;

    function buildKeypad() {
        const pool = configs[currentDifficulty].pool;
        keypadContainer.innerHTML = "";
        for (let i = 0; i < pool; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'key-btn';
            btn.innerText = i;
            btn.onclick = () => {
                if (guessInput.disabled) return;
                if (guessInput.value.length < configs[currentDifficulty].digits) {
                    guessInput.value += i;
                    syncTumblersToInput();
                }
            };
            keypadContainer.appendChild(btn);
        }
        const clrBtn = document.createElement('button');
        clrBtn.type = 'button';
        clrBtn.className = 'key-btn';
        clrBtn.innerHTML = '<i class="fa-solid fa-delete-left"></i>';
        clrBtn.onclick = () => {
            guessInput.value = guessInput.value.slice(0, -1);
            syncTumblersToInput();
        };
        keypadContainer.appendChild(clrBtn);
    }

    function syncTumblersToInput() {
        const val = guessInput.value;
        spinEnergy = 2.5;
        tumblerRings.forEach((r, idx) => {
            const digit = parseInt(val[idx] || 0);
            r.targetRotZ = (digit / 10) * Math.PI * 2;
        });
    }

    function changeDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
        resetGame();
    }

    function generateCode() {
        const cfg = configs[currentDifficulty];
        let nums = Array.from({length: cfg.pool}, (_, i) => i);
        let code = "";
        for(let i=0; i<cfg.digits; i++) {
            let index = Math.floor(Math.random() * nums.length);
            code += nums[index];
            nums.splice(index, 1);
        }
        return code;
    }

    guessInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        const max = configs[currentDifficulty].digits;
        if (this.value.length > max) this.value = this.value.slice(0, max);
        syncTumblersToInput();
    });

    guessForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const cfg = configs[currentDifficulty];
        let guess = guessInput.value.trim();

        if(guess.length !== cfg.digits) {
            statusMsg.innerText = `Error: Requires ${cfg.digits} digits.`;
            statusMsg.style.color = "#dc2626";
            setVaultStatus(0xdc2626, 6);
            return;
        }

        attempts++;
        if(attempts === 1) logArea.innerHTML = "";

        let exact = 0;
        let partial = 0;
        let secretArr = secretCode.split("");
        let guessArr = guess.split("");
        
        for(let i=0; i<cfg.digits; i++){
            if(guessArr[i] === secretArr[i]) {
                exact++;
                secretArr[i] = null;
                guessArr[i] = null;
                if (tumblerRings[i]) tumblerRings[i].torus.material.color.setHex(0x16a34a);
            } else {
                if (tumblerRings[i]) tumblerRings[i].torus.material.color.setHex(0x4f46e5);
            }
        }
        for(let i=0; i<cfg.digits; i++){
            if(guessArr[i] !== null && secretArr.includes(guessArr[i])) {
                partial++;
                secretArr[secretArr.indexOf(guessArr[i])] = null;
            }
        }

        addLogEntry(guess, exact, partial);
        guessInput.value = "";
        
        if(exact === cfg.digits) {
            setVaultStatus(0x16a34a, 8);
            handleEnd(true);
        } else if(attempts >= cfg.maxAttempts) {
            setVaultStatus(0xdc2626, 8);
            handleEnd(false);
        } else {
            setVaultStatus(exact > 0 ? 0xd97706 : 0x38bdf8, 5);
            statusMsg.innerText = `Attempt ${attempts}/${cfg.maxAttempts} Logged.`;
            statusMsg.style.color = "#d97706";
        }
    });

    function addLogEntry(guess, exact, partial) {
        const entry = document.createElement('div');
        const cfg = configs[currentDifficulty];
        entry.className = exact === cfg.digits ? 'log-entry exact' : 'log-entry';
        
        let feedback = "";
        for(let i=0; i<exact; i++) feedback += '<span style="color:#16a34a; font-size:1.1rem;">●</span> ';
        for(let i=0; i<partial; i++) feedback += '<span style="color:#d97706; font-size:1.1rem;">○</span> ';
        if(exact === 0 && partial === 0) feedback = '<span style="color:#dc2626; font-weight:600;">None</span>';

        entry.innerHTML = `
            <span style="font-family: monospace; font-size: 1.15rem; letter-spacing: 4px; color: var(--text-main); font-weight: bold;">${guess}</span>
            <div>${feedback}</div>
        `;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function handleEnd(win) {
        guessInput.disabled = true;
        const prevBest = parseInt(localStorage.getItem('cyanx_cipher_best') || 999);
        let isNewHigh = false;

        if (win && attempts < prevBest) {
            localStorage.setItem('cyanx_cipher_best', attempts);
            localStorage.setItem('cyanx_cipher_mode', currentDifficulty);
            isNewHigh = true;
        }

        const modal = document.getElementById('scoreModal');
        const title = document.getElementById('resultTitle');
        const badge = document.getElementById('resultBadge');
        const scoreVal = document.getElementById('popupAttempts');
        const highNote = document.getElementById('highScoreNote');

        title.innerText = win ? "VAULT DECRYPTED" : "SECURITY LOCKOUT";
        title.style.color = win ? "#16a34a" : "#dc2626";

        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;

        scoreVal.innerText = win ? `${attempts} tries` : "FAILED";
        highNote.innerText = isNewHigh ? "🎉 NEW CIPHER RECORD RECORDED!" : (win ? `Best: ${prevBest} attempts` : `Secret Code was: ${secretCode}`);

        modal.style.display = 'flex';
    }

    function retryCipher() {
        document.getElementById('scoreModal').style.display = 'none';
        resetGame();
    }

    function resetGame() {
        secretCode = generateCode();
        attempts = 0;
        const cfg = configs[currentDifficulty];
        buildCryptexTumblers(cfg.digits);
        buildKeypad();
        setVaultStatus(0x38bdf8, 3);

        modeDesc.innerText = cfg.desc;
        guessInput.placeholder = "0".repeat(cfg.digits);
        guessInput.maxLength = cfg.digits;
        guessInput.disabled = false;
        guessInput.value = "";
        
        logArea.innerHTML = `
            <div style="color: #4f46e5; text-align: center; padding-top: 15px; font-size: 0.85rem; line-height: 1.6;">
                <i class="fa-solid fa-cube"></i> Align ${cfg.digits} Cryptex tumblers to unlock.<br>
                <span style="color:#16a34a; font-weight: 600;">● Exact Lock</span> &nbsp;|&nbsp;
                <span style="color:#d97706; font-weight: 600;">○ Partial Match</span>
            </div>
        `;
        statusMsg.innerText = "";
    }

    window.addEventListener('resize', () => {
        vaultCamera.aspect = window.innerWidth / window.innerHeight;
        vaultCamera.updateProjectionMatrix();
        vaultRenderer.setSize(window.innerWidth, window.innerHeight);
        updateVaultLayout();
    });

    resetGame();
</script>
</body>
</html>
