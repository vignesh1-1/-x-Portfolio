<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vortex Interceptor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root { --bg-pure: #ffffff; --text-main: #000000; --text-sub: #64748b; --border-color: #cbd5e1; }
    body.dark-mode { --bg-pure: #000000; --text-main: #ffffff; --text-sub: #94a3b8; --border-color: #262626; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-pure); color: var(--text-main); overflow: hidden; font-family: 'Space Grotesk', sans-serif; user-select: none; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; pointer-events: none; }
    .hud-box { background: var(--bg-pure); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; box-shadow: 0 8px 25px rgba(79,70,229,0.1); }
    h2 { margin: 0; font-size: clamp(0.65rem, 2vw, 0.82rem); color: #4f46e5; text-transform: uppercase; letter-spacing: 1.5px; }
    span.val { color: var(--text-main); font-size: clamp(1.1rem, 3.5vw, 1.45rem); font-weight: bold; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pure); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 25; padding: 16px; }
    .modal-card { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 22px; padding: clamp(22px, 5vw, 38px); width: 100%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(79,70,229,0.15); }
    h1 { font-size: clamp(1.85rem, 6vw, 2.7rem); margin: 0 0 10px 0; color: var(--text-main); }

    .diff-group { display: flex; justify-content: center; gap: 6px; margin: 18px 0; flex-wrap: wrap; }
    .diff-btn { padding: 7px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
    .diff-btn.active { transform: scale(1.06); outline: 2px solid var(--text-main); }
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .btn { padding: 12px 28px; background: #4f46e5; border: none; color: white; font-size: 1rem; cursor: pointer; border-radius: 30px; font-family: inherit; margin: 6px; font-weight: bold; }
    .btn-outline { background: var(--bg-pure); border: 2px solid var(--border-color); color: var(--text-main); }
    .score-banner { font-size: clamp(2.3rem, 7vw, 3.2rem); font-weight: 800; color: #4f46e5; margin: 12px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; font-size: 0.8rem; }
</style>
</head>
<body>
    <div class="hud">
        <div class="hud-box"><h2>Shields</h2><span class="val" id="shieldDisplay">100%</span></div>
        <div class="hud-box"><h2>Score</h2><span class="val" id="scoreDisplay">0</span></div>
        <div class="hud-box"><h2>Best</h2><span class="val" id="bestDisplay">0</span></div>
    </div>

    <div class="modal-backdrop" id="startOverlay">
        <div class="modal-card">
            <h1>VORTEX INTERCEPTOR</h1>
            <p style="color:var(--text-sub); font-size:0.9rem; line-height: 1.5;">Drag your finger, move your cursor, or use A/D & Arrow Keys to orbit the wormhole perimeter while auto-blasting corrupt crawlers.</p>
            <div class="diff-group">
                <button class="diff-btn btn-easy active" onclick="setDifficulty('Easy')">Easy</button>
                <button class="diff-btn btn-med" onclick="setDifficulty('Medium')">Medium</button>
                <button class="diff-btn btn-hard" onclick="setDifficulty('Hard')">Hard</button>
                <button class="diff-btn btn-cyanx" onclick="setDifficulty('CYANX AI')">CYANX AI</button>
            </div>
            <div>
                <button class="btn" onclick="startGame()">ENGAGE VORTEX</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">BACK</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size:1.6rem; color:#dc2626; margin-bottom: 5px;">CONDUIT OVERRUN</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:var(--text-sub); font-size:0.9rem;">INTERCEPT SCORE</div>
            <div class="score-banner" id="popupScore">0</div>
            <p id="highScoreNote" style="font-size:0.88rem; color:#15803d; font-weight:600; margin-bottom:18px;"></p>
            <div>
                <button class="btn" onclick="retryGame()">PLAY AGAIN</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    const scene = new THREE.Scene();
    function checkTheme() {
        const saved = localStorage.getItem('theme') || localStorage.getItem('cyanx_theme') || 'light';
        const isDark = (saved === 'dark');
        document.body.classList.toggle('dark-mode', isDark);
        scene.background = new THREE.Color(isDark ? 0x000000 : 0xffffff);
    }
    checkTheme();
    window.addEventListener('storage', checkTheme);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
    function updateCamera() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        camera.position.set(0, 0, aspect < 0.75 ? 14 : 11);
        camera.lookAt(0, 0, -50);
        camera.updateProjectionMatrix();
    }
    updateCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const pointLight = new THREE.PointLight(0x38bdf8, 2.5, 90);
    pointLight.position.set(0, 0, 5);
    scene.add(pointLight);

    const TUNNEL_RADIUS = 4.6;
    const tunnelRings = [];
    const ringGeo = new THREE.RingGeometry(TUNNEL_RADIUS - 0.05, TUNNEL_RADIUS + 0.05, 12);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x4f46e5, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
    for (let i = 0; i < 14; i++) {
        const r = new THREE.Mesh(ringGeo, ringMat);
        r.position.z = 4 - i * 8;
        scene.add(r);
        tunnelRings.push(r);
    }

    // Longitudinal tunnel wireframe cylinder
    const tubeGeo = new THREE.CylinderGeometry(TUNNEL_RADIUS, TUNNEL_RADIUS, 120, 12, 1, true);
    tubeGeo.rotateX(Math.PI / 2);
    const tubeMesh = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.15 }));
    tubeMesh.position.z = -50;
    scene.add(tubeMesh);

    // Player Ship Rig
    const shipGroup = new THREE.Group();
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.3, 4), new THREE.MeshStandardMaterial({ color: 0x4f46e5, emissive: 0x312e81, metalness: 0.8, roughness: 0.2 }));
    nose.rotation.x = -Math.PI / 2;
    const wings = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 }));
    shipGroup.add(nose, wings);
    scene.add(shipGroup);

    let currentDifficulty = 'Easy';
    const diffConfigs = {
        'Easy':     { enemySpeed: 0.38, spawnRate: 38, fireRate: 9 },
        'Medium':   { enemySpeed: 0.50, spawnRate: 28, fireRate: 8 },
        'Hard':     { enemySpeed: 0.65, spawnRate: 20, fireRate: 7 },
        'CYANX AI': { enemySpeed: 0.82, spawnRate: 14, fireRate: 6 }
    };

    let gameActive = false, score = 0, shields = 100, frame = 0;
    let playerAngle = -Math.PI / 2, targetAngle = -Math.PI / 2, keyDir = 0;
    let lasers = [], enemies = [], particles = [];

    document.getElementById('bestDisplay').innerText = localStorage.getItem('cyanx_vortex_best') || 0;

    function setDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
    }

    function startGame() {
        document.getElementById('startOverlay').style.display = 'none';
        document.getElementById('scoreModal').style.display = 'none';
        lasers.forEach(l => scene.remove(l.mesh));
        enemies.forEach(e => scene.remove(e.mesh));
        particles.forEach(p => scene.remove(p.mesh));
        lasers = []; enemies = []; particles = [];
        score = 0; shields = 100; frame = 0;
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('shieldDisplay').innerText = '100%';
        gameActive = true;
    }

    function endGame() {
        gameActive = false;
        const prevBest = parseInt(localStorage.getItem('cyanx_vortex_best') || 0);
        let isNewHigh = false;
        if (score > prevBest) {
            localStorage.setItem('cyanx_vortex_best', score);
            localStorage.setItem('cyanx_vortex_mode', currentDifficulty);
            document.getElementById('bestDisplay').innerText = score;
            isNewHigh = true;
        }
        const badge = document.getElementById('resultBadge');
        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;
        document.getElementById('popupScore').innerText = score + " pts";
        document.getElementById('highScoreNote').innerText = isNewHigh ? "🎉 NEW VORTEX RECORD RECORDED!" : `Best Score: ${prevBest} pts`;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function retryGame() {
        document.getElementById('scoreModal').style.display = 'none';
        document.getElementById('startOverlay').style.display = 'flex';
    }

    window.addEventListener('mousemove', e => {
        if (!gameActive) return;
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        targetAngle = Math.atan2(-(e.clientY - cy), e.clientX - cx);
    });

    let lastTouchX = null;
    window.addEventListener('touchstart', e => {
        if (e.touches.length > 0) lastTouchX = e.touches[0].clientX;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
        if (!gameActive || e.touches.length === 0) return;
        const tx = e.touches[0].clientX;
        if (lastTouchX !== null) {
            targetAngle += ((tx - lastTouchX) / window.innerWidth) * Math.PI * 2.5;
        }
        lastTouchX = tx;
    }, { passive: true });

    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyDir = -1;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keyDir = 1;
    });
    window.addEventListener('keyup', e => {
        if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) keyDir = 0;
    });

    function createBurst(x, y, z, colorHex) {
        const geo = new THREE.OctahedronGeometry(0.2, 0);
        for (let i = 0; i < 12; i++) {
            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            particles.push({
                mesh,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                vz: (Math.random() - 0.5) * 0.35,
                life: 1
            });
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        if (keyDir !== 0) targetAngle += keyDir * 0.065;
        // Shortest angular interpolation
        let diff = Math.atan2(Math.sin(targetAngle - playerAngle), Math.cos(targetAngle - playerAngle));
        playerAngle += diff * 0.22;

        const r = TUNNEL_RADIUS - 0.45;
        shipGroup.position.set(Math.cos(playerAngle) * r, Math.sin(playerAngle) * r, 4);
        shipGroup.rotation.z = playerAngle + Math.PI / 2;

        if (gameActive) {
            const cfg = diffConfigs[currentDifficulty];
            frame++;

            tunnelRings.forEach(ring => {
                ring.position.z += cfg.enemySpeed * 1.4;
                if (ring.position.z > 8) ring.position.z -= 112;
            });

            // Auto-fire twin plasma bolts
            if (frame % cfg.fireRate === 0) {
                const bolt = new THREE.Mesh(
                    new THREE.BoxGeometry(0.18, 0.18, 1.4),
                    new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
                );
                bolt.position.copy(shipGroup.position);
                scene.add(bolt);
                lasers.push({ mesh: bolt, angle: playerAngle });
            }

            // Spawn Enemy Crawlers
            if (frame % cfg.spawnRate === 0) {
                const eAngle = (Math.floor(Math.random() * 12) / 12) * Math.PI * 2;
                const enemyMesh = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.65, 0),
                    new THREE.MeshStandardMaterial({ color: 0xdc2626, emissive: 0x991b1b, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.8 })
                );
                enemyMesh.position.set(Math.cos(eAngle) * r, Math.sin(eAngle) * r, -95);
                scene.add(enemyMesh);
                enemies.push({ mesh: enemyMesh, angle: eAngle });
            }

            // Update Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.mesh.position.z -= 1.8;
                if (l.mesh.position.z < -100) {
                    scene.remove(l.mesh);
                    lasers.splice(i, 1);
                }
            }

            // Update Enemies & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.mesh.position.z += cfg.enemySpeed + (score * 0.00004);
                e.mesh.rotation.x += 0.08;
                e.mesh.rotation.y += 0.08;

                let hit = false;
                for (let j = lasers.length - 1; j >= 0; j--) {
                    let l = lasers[j];
                    if (Math.abs(l.mesh.position.z - e.mesh.position.z) < 1.5) {
                        let aDiff = Math.abs(Math.atan2(Math.sin(l.angle - e.angle), Math.cos(l.angle - e.angle)));
                        if (aDiff < 0.32) {
                            createBurst(e.mesh.position.x, e.mesh.position.y, e.mesh.position.z, 0x38bdf8);
                            scene.remove(e.mesh); enemies.splice(i, 1);
                            scene.remove(l.mesh); lasers.splice(j, 1);
                            score += 150;
                            document.getElementById('scoreDisplay').innerText = score;
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit) continue;

                if (e.mesh.position.z >= 4.2) {
                    createBurst(e.mesh.position.x, e.mesh.position.y, 4, 0xdc2626);
                    scene.remove(e.mesh);
                    enemies.splice(i, 1);
                    shields -= 25;
                    document.getElementById('shieldDisplay').innerText = Math.max(0, shields) + '%';
                    if (shields <= 0) { endGame(); return; }
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.mesh.position.x += p.vx; p.mesh.position.y += p.vy; p.mesh.position.z += p.vz;
            p.life -= 0.05; p.mesh.material.opacity = Math.max(0, p.life);
            if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
        }

        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    window.addEventListener('resize', () => { updateCamera(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
