<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Development</title>
  <style>
    /* --- CSS Reset & Design Tokens --- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text-main: #000000;
      --text-muted: #555555;
      --border: #e5e5e5;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Neural Background Canvas --- */
    #neural-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* --- Content Card --- */
    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 1.5rem;
      padding: 3rem 2.5rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
    }

    /* Status Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--text-main);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--text-main);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.75);
      }
    }

    /* Typography */
    .title {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* Action Button */
    .action-wrapper {
      display: flex;
      justify-content: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background-color: var(--text-main);
      color: var(--bg);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 9999px;
      border: 1px solid var(--text-main);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .btn-back:hover {
      background-color: transparent;
      color: var(--text-main);
    }

    .btn-back:hover .arrow-icon {
      transform: translateX(-4px);
    }

    .btn-back:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Neural Canvas -->
  <canvas id="neural-canvas"></canvas>

  <!-- Centered Message Card -->
  <main class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Status &mdash; In Progress</span>
    </div>

    <h1 class="title">Under Development</h1>
    
    <p class="description">
      We are actively engineering and refining this experience. 
      Please check back shortly for the finalized release.
    </p>

    <div class="action-wrapper">
      <a href="index.html" class="btn-back">
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </div>
  </main>

  <!-- Neural Network Animation Logic -->
  <script>
    const canvas = document.getElementById("neural-canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    // Mouse interactive radius
    const mouse = {
      x: null,
      y: null,
      radius: 140
    };

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener("mouseout", () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    });

    class Neuron {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 0.75;
        this.vy = (Math.random() - 0.5) * 0.75;
        this.radius = Math.random() * 1.5 + 1.5; // Subtle black nodes
      }

      update() {
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();
      }
    }

    let neurons = [];

    function init() {
      neurons = [];
      const neuronCount = Math.floor((width * height) / 14000);

      for (let i = 0; i < neuronCount; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        neurons.push(new Neuron(x, y));
      }
    }

    function connect() {
      const maxDistance = 130;

      for (let a = 0; a < neurons.length; a++) {
        for (let b = a + 1; b < neurons.length; b++) {
          const dx = neurons[a].x - neurons[b].x;
          const dy = neurons[a].y - neurons[b].y;
          const dist = Math.hypot(dx, dy);

          if (dist < maxDistance) {
            const opacity = (1 - dist / maxDistance) * 0.22;
            ctx.strokeStyle = `rgba(0, 0, 0, ${opacity})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(neurons[a].x, neurons[a].y);
            ctx.lineTo(neurons[b].x, neurons[b].y);
            ctx.stroke();
          }
        }

        // Synaptic connections to the cursor
        if (mouse.x !== null && mouse.y !== null) {
          const dxMouse = neurons[a].x - mouse.x;
          const dyMouse = neurons[a].y - mouse.y;
          const distMouse = Math.hypot(dxMouse, dyMouse);

          if (distMouse < mouse.radius) {
            const mouseOpacity = (1 - distMouse / mouse.radius) * 0.45;
            ctx.strokeStyle = `rgba(0, 0, 0, ${mouseOpacity})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(neurons[a].x, neurons[a].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < neurons.length; i++) {
        neurons[i].update();
        neurons[i].draw();
      }

      connect();
      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
