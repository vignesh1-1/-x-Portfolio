name: Build Android APK (Live URL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Accelerated App
        run: |
          cordova create myApp com.vignesh.portfolio "Vignesh Portfolio"
          cd myApp

          # Copy icon from repository
          cp ../Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png ./icon.png

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.vignesh.portfolio" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>Vignesh Portfolio</name>
              <description>CYANX AI Portfolio Assistant</description>
              <author email="vigneshblrind@gmail.com">Vignesh P</author>

              <icon src="icon.png" />
              <content src="https://vignesh1-1.github.io/-x-Portfolio/" />

              <access origin="*" />
              <allow-navigation href="https://vignesh1-1.github.io/*" />
              <allow-navigation href="https://*.onrender.com/*" />

              <!-- GPU HARDWARE ACCELERATION & WEBVIEW PERFORMANCE -->
              <preference name="HardwareAcceleration" value="true" />
              <preference name="Orientation" value="portrait" />
              <preference name="AppendUserAgent" value="CYANXNativeApp" />
              <preference name="DisallowOverscroll" value="true" />
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="34" />

              <!-- Force enable hardware acceleration on the activity -->
              <platform name="android">
                  <edit-config file="AndroidManifest.xml" target="/manifest/application/activity[@android:name='MainActivity']" mode="merge">
                      <activity android:hardwareAccelerated="true" android:largeHeap="true" />
                  </edit-config>
              </platform>
          </widget>
          EOF

          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vignesh-Portfolio-App
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk