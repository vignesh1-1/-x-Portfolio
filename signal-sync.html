<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Sync 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root {
        --bg-pure: #ffffff;
        --text-main: #000000;
        --text-sub: #64748b;
        --border-color: #cbd5e1;
    }
    body.dark-mode {
        --bg-pure: #000000;
        --text-main: #ffffff;
        --text-sub: #94a3b8;
        --border-color: #262626;
    }

    body { margin: 0; background: var(--bg-pure); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: var(--text-main); font-family: 'Space Grotesk', sans-serif; overflow: hidden; position: relative; cursor: crosshair; touch-action: none; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .hud-top { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 8; pointer-events: none; }
    .hud-pill { background: var(--bg-pure); border: 1px solid var(--border-color); padding: 10px 22px; border-radius: 14px; box-shadow: 0 8px 25px rgba(79,70,229,0.1); font-weight: 700; font-size: 1rem; }

    .ui { position: absolute; z-index: 10; text-align: center; pointer-events: none; background: var(--bg-pure); padding: 38px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15); width: 90%; max-width: 500px; }
    h1 { font-size: 2.8rem; margin-bottom: 8px; color: var(--text-main); }
    
    .diff-group { display: flex; justify-content: center; gap: 8px; margin: 22px 0; pointer-events: auto; flex-wrap: wrap; }
    .diff-btn { padding: 7px 15px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .diff-btn.active { transform: scale(1.08); box-shadow: 0 4px 10px rgba(79,70,229,0.2); outline: 2px solid var(--text-main); }
    
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .btn { padding: 13px 32px; background: #4f46e5; border: none; color: white; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: inherit; pointer-events: auto; margin: 8px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); font-size: 1.05rem; }
    .btn:hover { background: #4338ca; transform: translateY(-2px); }
    .btn-outline { background: var(--bg-pure); border: 2px solid var(--border-color); color: var(--text-main); box-shadow: none; }

    /* POPUP MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pure); display: flex; justify-content: center; align-items: center; z-index: 50; }
    .modal-card { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 24px; padding: 38px; width: 90%; max-width: 480px; text-align: center; box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15); }
    .score-banner { font-size: 3.2rem; font-weight: 800; color: #16a34a; margin: 12px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; font-size: 0.85rem; }
</style>
</head>
<body>
    <div class="hud-top" id="hudTop" style="display: none;">
        <div class="hud-pill"><span style="color:#4f46e5;">NODE WAVE:</span> <span id="waveCounter">1 / 5</span></div>
        <div class="hud-pill"><span style="color:#4f46e5;">LAST SYNC:</span> <span id="lastMsDisplay">-- ms</span></div>
    </div>

    <div class="ui" id="uiPanel">
        <h1>SIGNAL SYNC 3D</h1>
        <p style="color:var(--text-sub); line-height:1.6;">Slice or hover across the <strong>5-Node 3D Holographic Satellite Wave</strong> the instant each satellite materializes in deep space.</p>

        <div class="diff-group">
            <button class="diff-btn btn-easy active" onclick="setDifficulty('Easy')">Easy</button>
            <button class="diff-btn btn-med" onclick="setDifficulty('Medium')">Medium</button>
            <button class="diff-btn btn-hard" onclick="setDifficulty('Hard')">Hard</button>
            <button class="diff-btn btn-cyanx" onclick="setDifficulty('CYANX AI')">CYANX AI</button>
        </div>

        <button class="btn" onclick="startSequence()">INITIALIZE WAVE</button>
        <button class="btn btn-outline" onclick="window.location.href='game.html'">BACK</button>
    </div>

    <!-- SCORE POPUP MODAL -->
    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 id="resultTitle" style="font-size:1.8rem; color:var(--text-main); margin-bottom: 5px;">SYNC COMPLETED</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:var(--text-sub); font-size:0.9rem;">AVERAGE REACTION LATENCY (5 NODES)</div>
            <div class="score-banner" id="popupReaction">0 ms</div>
            <div id="rankTag" style="font-weight:700; font-size:1.1rem; margin-bottom:10px;"></div>
            <p id="highScoreNote" style="font-size:0.9rem; color:#15803d; font-weight:600; margin-bottom:20px;"></p>
            
            <div>
                <button class="btn" onclick="retrySync()">RETRY</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    const uiPanel = document.getElementById('uiPanel');
    const hudTop = document.getElementById('hudTop');

    // --- PURE BLACK / WHITE THEME SYNC ---
    let isDarkTheme = false;
    function checkTheme() {
        const saved = localStorage.getItem('theme') || localStorage.getItem('cyanx_theme') || 'light';
        isDarkTheme = (saved === 'dark');
        document.body.classList.toggle('dark-mode', isDarkTheme);
        if (scene) {
            scene.background = new THREE.Color(isDarkTheme ? 0x000000 : 0xffffff);
        }
    }
    window.addEventListener('storage', checkTheme);

    // --- THREE.JS 3D HOLOGRAPHIC CHAMBER ---
    const scene = new THREE.Scene();
    checkTheme();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 22;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const pointLight = new THREE.PointLight(0x38bdf8, 3, 65);
    pointLight.position.set(5, 10, 18);
    scene.add(pointLight);

    // 3D Tunnel Rings Background
    const tunnelGroup = new THREE.Group();
    for (let i = 0; i < 6; i++) {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(8 + i * 2.5, 8.08 + i * 2.5, 6),
            new THREE.MeshBasicMaterial({ color: 0x4f46e5, side: THREE.DoubleSide, transparent: true, opacity: 0.14 })
        );
        ring.position.z = -i * 3;
        tunnelGroup.add(ring);
    }
    scene.add(tunnelGroup);

    // 3D Satellite Target Rig
    const targetGroup = new THREE.Group();
    const coreMesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(1.15, 1),
        new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x38bdf8, emissiveIntensity: 0.85, roughness: 0.1, metalness: 0.9 })
    );
    const gyroRing1 = new THREE.Mesh(
        new THREE.TorusGeometry(1.65, 0.08, 16, 64),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, metalness: 0.8, roughness: 0.2 })
    );
    const gyroRing2 = new THREE.Mesh(
        new THREE.TorusGeometry(2.05, 0.05, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true })
    );
    gyroRing2.rotation.x = Math.PI / 2.5;

    const hitMesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.3, 16, 16),
        new THREE.MeshBasicMaterial({ visible: false })
    );

    targetGroup.add(coreMesh, gyroRing1, gyroRing2, hitMesh);
    targetGroup.visible = false;
    scene.add(targetGroup);

    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2(-99, -99);

    let shards = [];
    let bladeTrail = [];

    let currentDifficulty = 'Easy';
    const diffConfigs = {
        'Easy':     { scale: 1.3,  minDelay: 900, maxDelay: 1800, distPad: 4.5 },
        'Medium':   { scale: 1.05, minDelay: 700, maxDelay: 1500, distPad: 6.0 },
        'Hard':     { scale: 0.82, minDelay: 550, maxDelay: 1200, distPad: 7.5 },
        'CYANX AI': { scale: 0.64, minDelay: 400, maxDelay: 950,  distPad: 8.5 }
    };

    const TOTAL_WAVE_NODES = 5;
    let currentWaveNode = 0;
    let waveReactions = [];
    let startTime;
    let timeoutId;
    let isWaiting = false;
    let targetActive = false;
    let pointerWorldX = 0;
    let pointerWorldY = 0;
    let spawnScaleAnim = 0;

    function spawnBladeParticle(wx, wy) {
        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.16, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 })
        );
        mesh.position.set(wx, wy, 0.5);
        scene.add(mesh);
        bladeTrail.push({ mesh, life: 1.0 });
    }

    function updatePointerAndRaycast(clientX, clientY) {
        mouseNDC.x = (clientX / window.innerWidth) * 2 - 1;
        mouseNDC.y = -(clientY / window.innerHeight) * 2 + 1;

        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
        const width = height * camera.aspect;
        pointerWorldX = (mouseNDC.x * width) / 2;
        pointerWorldY = (mouseNDC.y * height) / 2;

        spawnBladeParticle(pointerWorldX, pointerWorldY);

        if (targetActive) {
            raycaster.setFromCamera(mouseNDC, camera);
            const intersects = raycaster.intersectObject(hitMesh);
            if (intersects.length > 0) {
                handleNodeHit();
            }
        }
    }

    window.addEventListener('mousemove', (e) => updatePointerAndRaycast(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) updatePointerAndRaycast(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) updatePointerAndRaycast(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function setDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
    }

    function startSequence() {
        uiPanel.style.display = 'none';
        hudTop.style.display = 'flex';
        currentWaveNode = 0;
        waveReactions = [];
        document.getElementById('lastMsDisplay').innerText = '-- ms';
        queueNextNode();
    }

    function queueNextNode() {
        targetGroup.visible = false;
        targetActive = false;
        isWaiting = true;
        currentWaveNode++;
        document.getElementById('waveCounter').innerText = `${currentWaveNode} / ${TOTAL_WAVE_NODES}`;
        
        const cfg = diffConfigs[currentDifficulty];
        let randomDelay = Math.random() * (cfg.maxDelay - cfg.minDelay) + cfg.minDelay;
        timeoutId = setTimeout(showTarget, randomDelay);
    }

    function showTarget() {
        isWaiting = false;
        const vFOV = THREE.MathUtils.degToRad(camera.fov);
        const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
        const visibleWidth = visibleHeight * camera.aspect;

        const boundX = (visibleWidth / 2) - 3.2;
        const boundY = (visibleHeight / 2) - 3.2;

        const cfg = diffConfigs[currentDifficulty];
        let x, y, dist;
        let attempts = 0;

        do {
            x = (Math.random() * 2 - 1) * boundX;
            y = (Math.random() * 2 - 1) * boundY;
            dist = Math.hypot(x - pointerWorldX, y - pointerWorldY);
            attempts++;
        } while (dist < cfg.distPad && attempts < 25);
        
        targetGroup.position.set(x, y, 0);
        spawnScaleAnim = 0.05;
        targetGroup.scale.set(spawnScaleAnim, spawnScaleAnim, spawnScaleAnim);
        targetGroup.visible = true;
        targetActive = true;
        startTime = performance.now();
    }

    function shatterNode(x, y) {
        const geo = new THREE.TetrahedronGeometry(0.32, 0);
        for (let i = 0; i < 22; i++) {
            const mat = new THREE.MeshStandardMaterial({
                color: i % 2 === 0 ? 0x38bdf8 : 0x4f46e5,
                emissive: 0x2563eb,
                emissiveIntensity: 0.7,
                transparent: true,
                opacity: 1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, 0);
            scene.add(mesh);
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.15 + Math.random() * 0.35;
            shards.push({
                mesh,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                vz: (Math.random() - 0.3) * 0.4,
                life: 1.0
            });
        }
    }

    function handleNodeHit() {
        if (!targetActive) return;
        targetActive = false;

        let reactionTime = Math.floor(performance.now() - startTime);
        waveReactions.push(reactionTime);
        document.getElementById('lastMsDisplay').innerText = reactionTime + " ms";

        shatterNode(targetGroup.position.x, targetGroup.position.y);
        targetGroup.visible = false;

        if (currentWaveNode < TOTAL_WAVE_NODES) {
            queueNextNode();
        } else {
            finishWave();
        }
    }

    function finishWave() {
        hudTop.style.display = 'none';
        const avgReaction = Math.floor(waveReactions.reduce((a, b) => a + b, 0) / waveReactions.length);

        const prevBest = parseInt(localStorage.getItem('cyanx_signal_best') || 9999);
        let isNewHigh = false;
        if (avgReaction < prevBest) {
            localStorage.setItem('cyanx_signal_best', avgReaction);
            localStorage.setItem('cyanx_signal_mode', currentDifficulty);
            isNewHigh = true;
        }

        let rank = "HUMAN";
        let rankColor = "#64748b";
        if (avgReaction < 180) { rank = "CYANX OPERATOR 👑"; rankColor = "#d97706"; }
        else if (avgReaction < 260) { rank = "NEURAL CANDIDATE"; rankColor = "#4f46e5"; }
        else if (avgReaction < 350) { rank = "FAST HUMAN"; rankColor = "#0284c7"; }

        const modal = document.getElementById('scoreModal');
        const badge = document.getElementById('resultBadge');
        const scoreVal = document.getElementById('popupReaction');
        const rankTag = document.getElementById('rankTag');
        const highNote = document.getElementById('highScoreNote');

        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;

        scoreVal.innerText = avgReaction + " ms";
        rankTag.innerText = rank;
        rankTag.style.color = rankColor;
        highNote.innerText = isNewHigh ? "🎉 NEW REFLEX RECORD RECORDED!" : `Fastest Avg: ${prevBest} ms`;

        modal.style.display = 'flex';
    }

    document.body.addEventListener('mousedown', (e) => {
        if (isWaiting && uiPanel.style.display === 'none') {
            clearTimeout(timeoutId);
            isWaiting = false;
            hudTop.style.display = 'none';
            alert("PREMATURE SYNC DETECTED! Wait for the 3D satellite to materialize.");
            retrySync();
        }
    });

    function retrySync() {
        document.getElementById('scoreModal').style.display = 'none';
        uiPanel.style.display = 'block';
    }

    function animate() {
        requestAnimationFrame(animate);

        tunnelGroup.rotation.z += 0.002;
        camera.position.x += (pointerWorldX * 0.12 - camera.position.x) * 0.08;
        camera.position.y += (pointerWorldY * 0.12 - camera.position.y) * 0.08;
        camera.lookAt(0, 0, 0);

        if (targetActive) {
            const targetScale = diffConfigs[currentDifficulty].scale;
            spawnScaleAnim += (targetScale - spawnScaleAnim) * 0.25;
            targetGroup.scale.set(spawnScaleAnim, spawnScaleAnim, spawnScaleAnim);

            coreMesh.rotation.x += 0.04;
            coreMesh.rotation.y += 0.05;
            gyroRing1.rotation.x -= 0.05;
            gyroRing1.rotation.y += 0.03;
            gyroRing2.rotation.z += 0.06;
        }

        // Update Blade Trail
        for (let i = bladeTrail.length - 1; i >= 0; i--) {
            let b = bladeTrail[i];
            b.life -= 0.08;
            b.mesh.scale.setScalar(Math.max(0.1, b.life));
            b.mesh.material.opacity = Math.max(0, b.life);
            if (b.life <= 0) {
                scene.remove(b.mesh);
                bladeTrail.splice(i, 1);
            }
        }

        // Update Shattered Shards
        for (let i = shards.length - 1; i >= 0; i--) {
            let s = shards[i];
            s.mesh.position.x += s.vx;
            s.mesh.position.y += s.vy;
            s.mesh.position.z += s.vz;
            s.mesh.rotation.x += 0.15;
            s.mesh.rotation.y += 0.15;
            s.life -= 0.035;
            s.mesh.material.opacity = Math.max(0, s.life);
            if (s.life <= 0) {
                scene.remove(s.mesh);
                shards.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
