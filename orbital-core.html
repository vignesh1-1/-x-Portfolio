<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbital Core</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root { --bg-pure: #ffffff; --text-main: #000000; --text-sub: #64748b; --border-color: #cbd5e1; }
    body.dark-mode { --bg-pure: #000000; --text-main: #ffffff; --text-sub: #94a3b8; --border-color: #262626; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-pure); color: var(--text-main); overflow: hidden; font-family: 'Space Grotesk', sans-serif; user-select: none; touch-action: none; cursor: crosshair; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; pointer-events: none; }
    .hud-box { background: var(--bg-pure); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; box-shadow: 0 8px 25px rgba(79,70,229,0.1); }
    h2 { margin: 0; font-size: clamp(0.65rem, 2vw, 0.82rem); color: #4f46e5; text-transform: uppercase; letter-spacing: 1.5px; }
    span.val { color: var(--text-main); font-size: clamp(1.1rem, 3.5vw, 1.45rem); font-weight: bold; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pure); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 25; padding: 16px; }
    .modal-card { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 22px; padding: clamp(22px, 5vw, 38px); width: 100%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(79,70,229,0.15); }
    h1 { font-size: clamp(1.85rem, 6vw, 2.7rem); margin: 0 0 10px 0; color: var(--text-main); }

    .diff-group { display: flex; justify-content: center; gap: 6px; margin: 18px 0; flex-wrap: wrap; }
    .diff-btn { padding: 7px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
    .diff-btn.active { transform: scale(1.06); outline: 2px solid var(--text-main); }
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .btn { padding: 12px 28px; background: #4f46e5; border: none; color: white; font-size: 1rem; cursor: pointer; border-radius: 30px; font-family: inherit; margin: 6px; font-weight: bold; }
    .btn-outline { background: var(--bg-pure); border: 2px solid var(--border-color); color: var(--text-main); }
    .score-banner { font-size: clamp(2.3rem, 7vw, 3.2rem); font-weight: 800; color: #4f46e5; margin: 12px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; font-size: 0.8rem; }
</style>
</head>
<body>
    <div class="hud">
        <div class="hud-box"><h2>Spheres</h2><span class="val" id="livesDisplay">3</span></div>
        <div class="hud-box"><h2>Score</h2><span class="val" id="scoreDisplay">0</span></div>
        <div class="hud-box"><h2>Best</h2><span class="val" id="bestDisplay">0</span></div>
    </div>

    <div class="modal-backdrop" id="startOverlay">
        <div class="modal-card">
            <h1>ORBITAL CORE</h1>
            <p style="color:var(--text-sub); font-size:0.9rem; line-height: 1.5;">Orbit the magnetic paddle around the perimeter to deflect the kinetic plasma sphere inward, shattering the rotating armor rings and striking the central nucleus.</p>
            <div class="diff-group">
                <button class="diff-btn btn-easy active" onclick="setDifficulty('Easy')">Easy</button>
                <button class="diff-btn btn-med" onclick="setDifficulty('Medium')">Medium</button>
                <button class="diff-btn btn-hard" onclick="setDifficulty('Hard')">Hard</button>
                <button class="diff-btn btn-cyanx" onclick="setDifficulty('CYANX AI')">CYANX AI</button>
            </div>
            <div>
                <button class="btn" onclick="startGame()">LAUNCH SPHERE</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">BACK</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size:1.6rem; color:#dc2626; margin-bottom: 5px;">ORBIT LOST</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:var(--text-sub); font-size:0.9rem;">KINETIC SCORE</div>
            <div class="score-banner" id="popupScore">0</div>
            <p id="highScoreNote" style="font-size:0.88rem; color:#15803d; font-weight:600; margin-bottom:18px;"></p>
            <div>
                <button class="btn" onclick="retryGame()">PLAY AGAIN</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    const scene = new THREE.Scene();
    function checkTheme() {
        const saved = localStorage.getItem('theme') || localStorage.getItem('cyanx_theme') || 'light';
        const isDark = (saved === 'dark');
        document.body.classList.toggle('dark-mode', isDark);
        scene.background = new THREE.Color(isDark ? 0x000000 : 0xffffff);
    }
    checkTheme();
    window.addEventListener('storage', checkTheme);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
    function updateCamera() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        camera.position.set(0, aspect < 0.75 ? -18 : -14, aspect < 0.75 ? 36 : 26);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
    }
    updateCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const ballLight = new THREE.PointLight(0x38bdf8, 3, 35);
    scene.add(ballLight);

    const ARENA_RADIUS = 8.5;
    scene.add(new THREE.Mesh(
        new THREE.RingGeometry(ARENA_RADIUS - 0.08, ARENA_RADIUS + 0.08, 96),
        new THREE.MeshBasicMaterial({ color: 0x6366f1, side: THREE.DoubleSide, transparent: true, opacity: 0.35 })
    ));

    // Central Nucleus
    const nucleusMesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.25, 1),
        new THREE.MeshStandardMaterial({ color: 0x4f46e5, emissive: 0x38bdf8, emissiveIntensity: 0.7, roughness: 0.1, metalness: 0.9 })
    );
    scene.add(nucleusMesh);

    // Player Deflector Paddle
    let paddleMesh = null, paddleSpan = Math.PI / 3.2, paddleAngle = -Math.PI / 2;
    function buildPaddle(span) {
        if (paddleMesh) scene.remove(paddleMesh);
        paddleMesh = new THREE.Mesh(
            new THREE.TorusGeometry(ARENA_RADIUS, 0.32, 16, 48, span),
            new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x38bdf8, emissiveIntensity: 0.8 })
        );
        scene.add(paddleMesh);
    }

    // Plasma Sphere
    const ballMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 20, 20),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x38bdf8, emissiveIntensity: 1 })
    );
    scene.add(ballMesh);

    let currentDifficulty = 'Easy';
    const diffConfigs = {
        'Easy':     { speed: 0.18, span: Math.PI / 2.8, rotSpeed: 0.005 },
        'Medium':   { speed: 0.23, span: Math.PI / 3.4, rotSpeed: 0.008 },
        'Hard':     { speed: 0.28, span: Math.PI / 4.2, rotSpeed: 0.012 },
        'CYANX AI': { speed: 0.34, span: Math.PI / 5.0, rotSpeed: 0.016 }
    };

    let bricks = [], particles = [];
    let gameActive = false, score = 0, lives = 3;
    let ball = { x: 0, y: -5, vx: 0.1, vy: 0.15, speed: 0.18 };
    let pointerX = window.innerWidth / 2, pointerY = window.innerHeight / 2 + 100;

    document.getElementById('bestDisplay').innerText = localStorage.getItem('cyanx_orbital_best') || 0;

    function buildArmorRings() {
        bricks.forEach(b => scene.remove(b.mesh));
        bricks = [];
        const rings = [{ r: 2.7, count: 8, color: 0xdc2626 }, { r: 4.1, count: 12, color: 0x6366f1 }];
        rings.forEach((ring, rIdx) => {
            for (let i = 0; i < ring.count; i++) {
                const angle = (i / ring.count) * Math.PI * 2;
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.95, 0.45, 0.55),
                    new THREE.MeshStandardMaterial({ color: ring.color, emissive: ring.color, emissiveIntensity: 0.35, roughness: 0.2, metalness: 0.8 })
                );
                scene.add(mesh);
                bricks.push({ mesh, r: ring.r, angle, dir: rIdx % 2 === 0 ? 1 : -1 });
            }
        });
    }

    function resetBall() {
        const cfg = diffConfigs[currentDifficulty];
        ball.speed = cfg.speed;
        ball.x = Math.cos(paddleAngle) * (ARENA_RADIUS - 1.2);
        ball.y = Math.sin(paddleAngle) * (ARENA_RADIUS - 1.2);
        const inwardAngle = paddleAngle + Math.PI + (Math.random() - 0.5) * 0.4;
        ball.vx = Math.cos(inwardAngle) * ball.speed;
        ball.vy = Math.sin(inwardAngle) * ball.speed;
    }

    function setDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
    }

    function startGame() {
        document.getElementById('startOverlay').style.display = 'none';
        document.getElementById('scoreModal').style.display = 'none';
        paddleSpan = diffConfigs[currentDifficulty].span;
        buildPaddle(paddleSpan);
        buildArmorRings();
        score = 0; lives = 3;
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('livesDisplay').innerText = '3';
        resetBall();
        gameActive = true;
    }

    function endGame() {
        gameActive = false;
        const prevBest = parseInt(localStorage.getItem('cyanx_orbital_best') || 0);
        let isNewHigh = false;
        if (score > prevBest) {
            localStorage.setItem('cyanx_orbital_best', score);
            localStorage.setItem('cyanx_orbital_mode', currentDifficulty);
            document.getElementById('bestDisplay').innerText = score;
            isNewHigh = true;
        }
        const badge = document.getElementById('resultBadge');
        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;
        document.getElementById('popupScore').innerText = score + " pts";
        document.getElementById('highScoreNote').innerText = isNewHigh ? "🎉 NEW ORBITAL RECORD RECORDED!" : `Best Score: ${prevBest} pts`;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function retryGame() {
        document.getElementById('scoreModal').style.display = 'none';
        document.getElementById('startOverlay').style.display = 'flex';
    }

    window.addEventListener('mousemove', e => { pointerX = e.clientX; pointerY = e.clientY; });
    window.addEventListener('touchmove', e => { if (e.touches.length > 0) { pointerX = e.touches[0].clientX; pointerY = e.touches[0].clientY; } }, { passive: true });
    window.addEventListener('touchstart', e => { if (e.touches.length > 0) { pointerX = e.touches[0].clientX; pointerY = e.touches[0].clientY; } }, { passive: true });

    function spawnBurst(x, y, colorHex) {
        const geo = new THREE.OctahedronGeometry(0.18, 0);
        for (let i = 0; i < 10; i++) {
            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 }));
            mesh.position.set(x, y, 0); scene.add(mesh);
            particles.push({ mesh, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, life: 1 });
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        nucleusMesh.rotation.x += 0.02; nucleusMesh.rotation.y += 0.03;

        paddleAngle = Math.atan2(-(pointerY - window.innerHeight / 2), pointerX - window.innerWidth / 2);
        if (paddleMesh) paddleMesh.rotation.z = paddleAngle - paddleSpan / 2;

        if (gameActive) {
            const cfg = diffConfigs[currentDifficulty];
            bricks.forEach(b => {
                b.angle += cfg.rotSpeed * b.dir;
                b.mesh.position.set(Math.cos(b.angle) * b.r, Math.sin(b.angle) * b.r, 0);
                b.mesh.rotation.z = b.angle + Math.PI / 2;
            });

            ball.x += ball.vx;
            ball.y += ball.vy;
            ballMesh.position.set(ball.x, ball.y, 0);
            ballLight.position.set(ball.x, ball.y, 3);

            const dist = Math.hypot(ball.x, ball.y);

            // Central Nucleus Strike (+300 bonus + respawn armor if empty)
            if (dist < 1.65) {
                const normAngle = Math.atan2(ball.y, ball.x);
                ball.speed = Math.min(0.42, ball.speed + 0.008);
                ball.vx = Math.cos(normAngle) * ball.speed;
                ball.vy = Math.sin(normAngle) * ball.speed;
                score += 250;
                document.getElementById('scoreDisplay').innerText = score;
                spawnBurst(ball.x, ball.y, 0x38bdf8);
                if (bricks.length === 0) buildArmorRings();
            }

            // Armor Brick Collisions
            for (let i = bricks.length - 1; i >= 0; i--) {
                let b = bricks[i];
                if (Math.hypot(ball.x - b.mesh.position.x, ball.y - b.mesh.position.y) < 0.85) {
                    const bounceAngle = Math.atan2(ball.y - b.mesh.position.y, ball.x - b.mesh.position.x);
                    ball.vx = Math.cos(bounceAngle) * ball.speed;
                    ball.vy = Math.sin(bounceAngle) * ball.speed;
                    spawnBurst(b.mesh.position.x, b.mesh.position.y, 0x6366f1);
                    scene.remove(b.mesh);
                    bricks.splice(i, 1);
                    score += 100;
                    document.getElementById('scoreDisplay').innerText = score;
                    break;
                }
            }

            // Outer Perimeter Paddle Check
            if (dist >= ARENA_RADIUS - 0.5 && dist <= ARENA_RADIUS + 0.6) {
                const bAngle = Math.atan2(ball.y, ball.x);
                const angleDiff = Math.atan2(Math.sin(bAngle - paddleAngle), Math.cos(bAngle - paddleAngle));
                if (Math.abs(angleDiff) <= paddleSpan / 2 + 0.12) {
                    // Reflect inward with slight english based on hit offset
                    const reflectAngle = bAngle + Math.PI + (angleDiff * 0.45);
                    ball.vx = Math.cos(reflectAngle) * ball.speed;
                    ball.vy = Math.sin(reflectAngle) * ball.speed;
                    ball.x = Math.cos(bAngle) * (ARENA_RADIUS - 0.6);
                    ball.y = Math.sin(bAngle) * (ARENA_RADIUS - 0.6);
                    spawnBurst(ball.x, ball.y, 0x38bdf8);
                }
            }

            // Out of Bounds
            if (dist > ARENA_RADIUS + 2.2) {
                lives--;
                document.getElementById('livesDisplay').innerText = lives;
                if (lives <= 0) { endGame(); return; }
                resetBall();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.mesh.position.x += p.vx; p.mesh.position.y += p.vy;
            p.life -= 0.05; p.mesh.material.opacity = Math.max(0, p.life);
            if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
        }
        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    window.addEventListener('resize', () => { updateCamera(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
