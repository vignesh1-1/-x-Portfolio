<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gravity Well</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="Gemini_Generated_Image_ko64ocko64ocko64-removebg-preview.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root { --bg-pure: #ffffff; --text-main: #000000; --text-sub: #64748b; --border-color: #cbd5e1; }
    body.dark-mode { --bg-pure: #000000; --text-main: #ffffff; --text-sub: #94a3b8; --border-color: #262626; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-pure); color: var(--text-main); overflow: hidden; font-family: 'Space Grotesk', sans-serif; user-select: none; touch-action: none; cursor: pointer; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; pointer-events: none; }
    .hud-box { background: var(--bg-pure); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; box-shadow: 0 8px 25px rgba(79,70,229,0.1); }
    h2 { margin: 0; font-size: clamp(0.65rem, 2vw, 0.82rem); color: #4f46e5; text-transform: uppercase; letter-spacing: 1.5px; }
    span.val { color: var(--text-main); font-size: clamp(1.1rem, 3.5vw, 1.45rem); font-weight: bold; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-pure); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 25; padding: 16px; }
    .modal-card { background: var(--bg-pure); border: 1px solid var(--border-color); border-radius: 22px; padding: clamp(22px, 5vw, 38px); width: 100%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(79,70,229,0.15); }
    h1 { font-size: clamp(1.85rem, 6vw, 2.7rem); margin: 0 0 10px 0; color: var(--text-main); }

    .diff-group { display: flex; justify-content: center; gap: 6px; margin: 18px 0; flex-wrap: wrap; }
    .diff-btn { padding: 7px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
    .diff-btn.active { transform: scale(1.06); outline: 2px solid var(--text-main); }
    .btn-easy { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .btn-med { background: #fef08a; color: #713f12; border: 1px solid #fde047; }
    .btn-hard { background: #fce7f3; color: #991b1b; border: 1px solid #fbcfe8; }
    .btn-cyanx { background: #ede9fe; color: #581c87; border: 1px solid #ddd6fe; }

    .btn { padding: 12px 28px; background: #4f46e5; border: none; color: white; font-size: 1rem; cursor: pointer; border-radius: 30px; font-family: inherit; margin: 6px; font-weight: bold; }
    .btn-outline { background: var(--bg-pure); border: 2px solid var(--border-color); color: var(--text-main); }
    .score-banner { font-size: clamp(2.3rem, 7vw, 3.2rem); font-weight: 800; color: #4f46e5; margin: 12px 0; }
    .mode-indicator { display: inline-block; padding: 6px 14px; border-radius: 12px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; font-size: 0.8rem; }
</style>
</head>
<body>
    <div class="hud">
        <div class="hud-box"><h2>Core Stability</h2><span class="val" id="stabilityDisplay">100%</span></div>
        <div class="hud-box"><h2>Pulse Charge</h2><span class="val" id="chargeDisplay">0%</span></div>
        <div class="hud-box"><h2>Score</h2><span class="val" id="scoreDisplay">0</span></div>
    </div>

    <div class="modal-backdrop" id="startOverlay">
        <div class="modal-card">
            <h1>GRAVITY WELL</h1>
            <p style="color:var(--text-sub); font-size:0.9rem; line-height: 1.5;"><strong>Hold</strong> anywhere (or SPACE) to pull blue quantum shards into the singularity and build Pulse Charge. <strong>Release</strong> to detonate a shockwave that vaporizes red antimatter meteors.</p>
            <div class="diff-group">
                <button class="diff-btn btn-easy active" onclick="setDifficulty('Easy')">Easy</button>
                <button class="diff-btn btn-med" onclick="setDifficulty('Medium')">Medium</button>
                <button class="diff-btn btn-hard" onclick="setDifficulty('Hard')">Hard</button>
                <button class="diff-btn btn-cyanx" onclick="setDifficulty('CYANX AI')">CYANX AI</button>
            </div>
            <div>
                <button class="btn" onclick="startGame()">IGNITE SINGULARITY</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">BACK</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="scoreModal" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size:1.6rem; color:#dc2626; margin-bottom: 5px;">HORIZON COLLAPSE</h2>
            <div id="resultBadge" class="mode-indicator"></div>
            <div style="color:var(--text-sub); font-size:0.9rem;">SINGULARITY SCORE</div>
            <div class="score-banner" id="popupScore">0</div>
            <p id="highScoreNote" style="font-size:0.88rem; color:#15803d; font-weight:600; margin-bottom:18px;"></p>
            <div>
                <button class="btn" onclick="retryGame()">PLAY AGAIN</button>
                <button class="btn btn-outline" onclick="window.location.href='game.html'">MAIN MENU</button>
            </div>
        </div>
    </div>

<script>
    const scene = new THREE.Scene();
    function checkTheme() {
        const saved = localStorage.getItem('theme') || localStorage.getItem('cyanx_theme') || 'light';
        const isDark = (saved === 'dark');
        document.body.classList.toggle('dark-mode', isDark);
        scene.background = new THREE.Color(isDark ? 0x000000 : 0xffffff);
    }
    checkTheme();
    window.addEventListener('storage', checkTheme);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    function updateCamera() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        camera.position.set(0, aspect < 0.75 ? -18 : -14, aspect < 0.75 ? 34 : 25);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
    }
    updateCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const coreLight = new THREE.PointLight(0x6366f1, 3, 50);
    coreLight.position.set(0, 0, 5);
    scene.add(coreLight);

    // Singularity Core & Swirling Accretion Disk
    const singularityGroup = new THREE.Group();
    const coreSphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.3, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x1e1b4b, emissive: 0x4f46e5, emissiveIntensity: 0.7, roughness: 0.1, metalness: 0.9 })
    );
    const horizonRing = new THREE.Mesh(
        new THREE.TorusGeometry(2.1, 0.08, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true })
    );
    singularityGroup.add(coreSphere, horizonRing);
    scene.add(singularityGroup);

    // Accretion Disk Particle Vortex
    const diskCount = 220;
    const diskGeo = new THREE.BufferGeometry();
    const diskPos = new Float32Array(diskCount * 3);
    for (let i = 0; i < diskCount; i++) {
        const r = 2.4 + Math.random() * 8;
        const a = Math.random() * Math.PI * 2;
        diskPos[i * 3] = Math.cos(a) * r;
        diskPos[i * 3 + 1] = Math.sin(a) * r;
        diskPos[i * 3 + 2] = (Math.random() - 0.5) * 0.8;
    }
    diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
    const diskPoints = new THREE.Points(diskGeo, new THREE.PointsMaterial({ color: 0x6366f1, size: 0.2, transparent: true, opacity: 0.6 }));
    scene.add(diskPoints);

    let currentDifficulty = 'Easy';
    const diffConfigs = {
        'Easy':     { spawnRate: 42, redChance: 0.30, baseSpeed: 0.06 },
        'Medium':   { spawnRate: 32, redChance: 0.38, baseSpeed: 0.08 },
        'Hard':     { spawnRate: 24, redChance: 0.45, baseSpeed: 0.10 },
        'CYANX AI': { spawnRate: 18, redChance: 0.52, baseSpeed: 0.13 }
    };

    let gameActive = false, isPulling = false, score = 0, stability = 100, charge = 0, frame = 0;
    let bodies = [], shockwaves = [];

    function setDifficulty(mode) {
        currentDifficulty = mode;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (mode === 'Easy') document.querySelector('.btn-easy').classList.add('active');
        if (mode === 'Medium') document.querySelector('.btn-med').classList.add('active');
        if (mode === 'Hard') document.querySelector('.btn-hard').classList.add('active');
        if (mode === 'CYANX AI') document.querySelector('.btn-cyanx').classList.add('active');
    }

    function startGame() {
        document.getElementById('startOverlay').style.display = 'none';
        document.getElementById('scoreModal').style.display = 'none';
        bodies.forEach(b => scene.remove(b.mesh));
        shockwaves.forEach(s => scene.remove(s.mesh));
        bodies = []; shockwaves = [];
        score = 0; stability = 100; charge = 40; frame = 0; isPulling = false;
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('stabilityDisplay').innerText = '100%';
        document.getElementById('chargeDisplay').innerText = '40%';
        gameActive = true;
    }

    function endGame() {
        gameActive = false;
        isPulling = false;
        const prevBest = parseInt(localStorage.getItem('cyanx_gravity_best') || 0);
        let isNewHigh = false;
        if (score > prevBest) {
            localStorage.setItem('cyanx_gravity_best', score);
            localStorage.setItem('cyanx_gravity_mode', currentDifficulty);
            isNewHigh = true;
        }
        const badge = document.getElementById('resultBadge');
        badge.innerText = currentDifficulty;
        badge.className = `mode-indicator btn-${currentDifficulty === 'Easy' ? 'easy' : currentDifficulty === 'Medium' ? 'med' : currentDifficulty === 'Hard' ? 'hard' : 'cyanx'}`;
        document.getElementById('popupScore').innerText = score + " pts";
        document.getElementById('highScoreNote').innerText = isNewHigh ? "🎉 NEW SINGULARITY RECORD RECORDED!" : `Best Score: ${prevBest} pts`;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function retryGame() {
        document.getElementById('scoreModal').style.display = 'none';
        document.getElementById('startOverlay').style.display = 'flex';
    }

    function releaseShockwave() {
        if (!gameActive || !isPulling) return;
        isPulling = false;
        if (charge >= 20) {
            const blastRadius = 4 + (charge / 100) * 10;
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.5, 0.9, 48),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.95 })
            );
            scene.add(ring);
            shockwaves.push({ mesh: ring, scale: 1, maxScale: blastRadius, life: 1 });

            for (let i = bodies.length - 1; i >= 0; i--) {
                let b = bodies[i];
                if (b.isRed && Math.hypot(b.mesh.position.x, b.mesh.position.y) <= blastRadius + 1.5) {
                    scene.remove(b.mesh);
                    bodies.splice(i, 1);
                    score += 200;
                }
            }
            charge = 0;
            document.getElementById('chargeDisplay').innerText = '0%';
            document.getElementById('scoreDisplay').innerText = score;
        }
    }

    renderer.domElement.addEventListener('pointerdown', () => { if (gameActive) isPulling = true; });
    window.addEventListener('pointerup', releaseShockwave);
    window.addEventListener('keydown', e => { if (e.code === 'Space' && gameActive) isPulling = true; });
    window.addEventListener('keyup', e => { if (e.code === 'Space') releaseShockwave(); });

    function spawnCelestialBody(cfg) {
        const angle = Math.random() * Math.PI * 2;
        const r = 16;
        const isRed = Math.random() < cfg.redChance;
        const mesh = new THREE.Mesh(
            new THREE.OctahedronGeometry(isRed ? 0.65 : 0.48, 0),
            new THREE.MeshStandardMaterial({
                color: isRed ? 0xdc2626 : 0x38bdf8,
                emissive: isRed ? 0x991b1b : 0x0284c7,
                emissiveIntensity: 0.8
            })
        );
        mesh.position.set(Math.cos(angle) * r, Math.sin(angle) * r, 0);
        scene.add(mesh);
        bodies.push({ mesh, angle, r, isRed, vr: cfg.baseSpeed });
    }

    function animate() {
        requestAnimationFrame(animate);

        const spinSpeed = isPulling ? 0.06 : 0.015;
        diskPoints.rotation.z += spinSpeed;
        horizonRing.rotation.z -= spinSpeed * 1.5;
        const targetScale = isPulling ? 1.35 : 1.0;
        singularityGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.15);

        if (gameActive) {
            const cfg = diffConfigs[currentDifficulty];
            frame++;
            if (frame % cfg.spawnRate === 0) spawnCelestialBody(cfg);

            for (let i = bodies.length - 1; i >= 0; i--) {
                let b = bodies[i];
                // Tangential orbit + inward pull
                b.angle += (isPulling ? 0.045 : 0.02) * (10 / Math.max(2, b.r));
                const pullMult = isPulling ? (b.isRed ? 1.9 : 3.2) : 1.0;
                b.r -= b.vr * pullMult;

                b.mesh.position.set(Math.cos(b.angle) * b.r, Math.sin(b.angle) * b.r, 0);
                b.mesh.rotation.x += 0.06;
                b.mesh.rotation.y += 0.06;

                if (b.r <= 1.7) {
                    scene.remove(b.mesh);
                    bodies.splice(i, 1);
                    if (b.isRed) {
                        stability -= 25;
                        document.getElementById('stabilityDisplay').innerText = Math.max(0, stability) + '%';
                        if (stability <= 0) { endGame(); return; }
                    } else {
                        score += 120;
                        charge = Math.min(100, charge + 20);
                        document.getElementById('scoreDisplay').innerText = score;
                        document.getElementById('chargeDisplay').innerText = charge + '%';
                    }
                }
            }
        }

        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let s = shockwaves[i];
            s.scale += (s.maxScale - s.scale) * 0.18;
            s.mesh.scale.set(s.scale, s.scale, 1);
            s.life -= 0.05;
            s.mesh.material.opacity = Math.max(0, s.life);
            if (s.life <= 0) { scene.remove(s.mesh); shockwaves.splice(i, 1); }
        }

        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
    window.addEventListener('resize', () => { updateCamera(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
